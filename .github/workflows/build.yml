name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Módulo nativo C++ (filtro XInput) y su prueba de humo
        shell: pwsh
        run: |
          cmake -S native/SplitForge.XInputFilter -B native/build -A x64
          cmake --build native/build --config Release
          ctest --test-dir native/build -C Release --output-on-failure

      - name: Módulo nativo C++ (emulador de Steam) y su prueba de humo
        shell: pwsh
        run: |
          cmake -S native/SplitForge.SteamEmu -B native/build-steamemu -A x64
          cmake --build native/build-steamemu --config Release
          ctest --test-dir native/build-steamemu -C Release --output-on-failure

      - name: Pruebas .NET
        run: dotnet test SplitForge.slnx -c Release --blame-hang-timeout 60s --logger "console;verbosity=normal"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Pruebas del prototipo Python (referencia validada)
        run: python -m unittest discover -s tests -v

      - name: Documentación
        run: python tools/check_docs.py

      - name: Publicar SplitForge win-x64 (autónomo, sin instalar .NET)
        shell: pwsh
        run: |
          dotnet publish src/SplitForge.App -c Release -r win-x64 --self-contained -o artifacts/SplitForge
          dotnet publish src/SplitForge.Diagnostico -c Release -r win-x64 --self-contained -o artifacts/SplitForge
          New-Item -ItemType Directory -Force artifacts/SplitForge/native | Out-Null
          Copy-Item native/build/Release/SplitForge.XInputFilter.dll artifacts/SplitForge/native/
          New-Item -ItemType Directory -Force artifacts/SplitForge/native/SplitForge.SteamEmu | Out-Null
          Copy-Item native/build-steamemu/Release/steam_api64.dll artifacts/SplitForge/native/SplitForge.SteamEmu/
          Copy-Item LEEME_DESCARGA.txt artifacts/SplitForge/LEEME.txt
          Get-ChildItem artifacts/SplitForge -Filter *.pdb | Remove-Item

      - name: Prueba de humo del ejecutable de diagnóstico
        shell: pwsh
        run: |
          ./artifacts/SplitForge/SplitForge.Diagnostico.exe steam --salida artifacts/steam.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./artifacts/SplitForge/SplitForge.Diagnostico.exe mandos --segundos 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prueba de arranque de la interfaz (capturas de cada pestaña)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          New-Item -ItemType Directory -Force capturas | Out-Null
          function Capture([string]$name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/capturas/$name.png")
          }
          $p = Start-Process artifacts/SplitForge/SplitForge.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "SplitForge.exe se cerró al arrancar (código $($p.ExitCode))"; exit 1 }
          $p.Refresh()
          $root = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
          $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::TabItem)
          $tabs = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cond)
          Write-Host "Pestañas encontradas: $($tabs.Count)"
          $i = 0
          foreach ($t in $tabs) {
            $i++
            $t.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep -Milliseconds 1500
            Capture ("pestana-{0}" -f $i)
          }
          if ($tabs.Count -ne 7) { Write-Error "Se esperaban 7 pestañas"; exit 1 }
          $p.CloseMainWindow() | Out-Null
          if (-not $p.WaitForExit(20000)) { Capture "cierre-bloqueado"; Write-Error "SplitForge.exe no se cerró de forma ordenada"; $p.Kill(); exit 1 }
          Get-Content "$env:LOCALAPPDATA/SplitForge/splitforge-net.log" -Tail 20

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: captura-interfaz
          path: capturas
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: SplitForge-win-x64
          path: artifacts/SplitForge
          retention-days: 30

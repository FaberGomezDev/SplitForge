name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release win-x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Módulo nativo C++ (filtro XInput) y su prueba de humo
        shell: pwsh
        run: |
          cmake -S native/SplitForge.XInputFilter -B native/build -A x64
          cmake --build native/build --config Release
          ctest --test-dir native/build -C Release --output-on-failure

      - name: Módulo nativo C++ (emulador de Steam educativo) y su prueba de humo
        shell: pwsh
        run: |
          cmake -S native/SplitForge.SteamEmu -B native/build-steamemu -A x64
          cmake --build native/build-steamemu --config Release
          ctest --test-dir native/build-steamemu -C Release --output-on-failure

      - name: Pruebas .NET
        run: dotnet test SplitForge.slnx -c Release --blame-hang-timeout 60s

      - name: Publicar y comprimir
        shell: pwsh
        run: |
          dotnet publish src/SplitForge.App -c Release -r win-x64 --self-contained -o artifacts/SplitForge
          dotnet publish src/SplitForge.Diagnostico -c Release -r win-x64 --self-contained -o artifacts/SplitForge
          New-Item -ItemType Directory -Force artifacts/SplitForge/native | Out-Null
          Copy-Item native/build/Release/SplitForge.XInputFilter.dll artifacts/SplitForge/native/
          New-Item -ItemType Directory -Force artifacts/SplitForge/native/SplitForge.SteamEmu | Out-Null
          Copy-Item native/build-steamemu/Release/steam_api64.dll artifacts/SplitForge/native/SplitForge.SteamEmu/
          Copy-Item LEEME_DESCARGA.txt artifacts/SplitForge/LEEME.txt
          Get-ChildItem artifacts/SplitForge -Filter *.pdb | Remove-Item
          $zip = "artifacts/SplitForge-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path artifacts/SplitForge -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash | Out-File "$zip.sha256" -Encoding ascii

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Las versiones 0.x son experimentales: se publican como prerelease.
          $extra = @()
          if ("${{ github.ref_name }}".StartsWith("v0.")) { $extra += "--prerelease" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts/*.zip, artifacts/*.sha256).FullName `
            --title "SplitForge ${{ github.ref_name }}" @extra `
            --notes "Paquete autónomo para Windows 10/11 x64. Descomprime y ejecuta SplitForge.exe. Ver LEEME.txt."
